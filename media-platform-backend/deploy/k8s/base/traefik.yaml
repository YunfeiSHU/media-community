apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: auth-security-headers
  namespace: auth-platform
spec:
  headers:
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: strict-origin-when-cross-origin
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: auth-service
  namespace: auth-platform
spec:
  entryPoints:
  - web
  routes:
  - match: Host(`auth.localhost`) && PathPrefix(`/api`)
    kind: Rule
    middlewares:
    - name: auth-security-headers
    services:
    - name: auth-service
      port: 80
      passHostHeader: true
