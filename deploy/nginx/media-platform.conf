# 同源反代配置（生产入口）
#
# 浏览器只访问 https://your.site，由本文件按路径分发：
#   /api    -> gateway:8000
#   /ws     -> gateway:8000（WebSocket Upgrade）
#   /media  -> MinIO:9000
#   /live   -> SRS:8088
#   /       -> 前端静态文件（SPA fallback）
#
# 页面与接口同源，浏览器不发跨域预检，也不需要给网关配 CORS。
# 下游服务与基础设施端口都只绑 127.0.0.1（见 compose.*.yml），唯一公网入口是这里的 443。

# WebSocket 需要把 Connection 头改成 upgrade；空值时置 close 避免长连接挂住
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name your.site;
    # 生产环境把 80 全部跳 443；本地调试可注释掉
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your.site;

    # 证书路径按实际替换
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 前端构建产物
    root /usr/share/nginx/html;
    index index.html;

    # 上传分片默认 5MiB，留足余量
    client_max_body_size 16m;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    # ---------------------------------------------------------------- 静态站
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可以长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------------------------------------------------------------- API
    # 大文件分片上传：关闭请求缓冲、放宽读超时。
    # 正则 location 优先于普通前缀，命中这里就不会走下面的 /api/。
    location ~ ^/api/v1/videos/[^/]+/upload {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 用 $remote_addr「覆盖」而不是 $proxy_add_x_forwarded_for「追加」：
        # 追加会把客户端自带的伪造值留在第一位，而网关的 IpRateLimitFilter 取的是第一个 IP，
        # 那样就能靠伪造 X-Forwarded-For 绕过限流。
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;

        proxy_read_timeout 60s;
    }

    # ---------------------------------------------------------------- WebSocket
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

        # 弹幕是长连接，不能按默认 60s 断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------------------------------------------------------------- 媒体
    # MinIO 的 S3 API；HLS 分片与图片都从这里出。
    # 末尾斜杠 = 剥掉 /media/ 前缀：
    #   /media/media/video/1/master.m3u8 -> MinIO 的 /media/video/1/master.m3u8
    # 少写这个斜杠就会变成 /media/media/media/...，表现为播放器 404。
    location /media/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header x-amz-request-id;

        # 分片/图片内容不变，可长期缓存
        proxy_cache_valid 200 206 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 直播：m3u8 绝不能缓存（切流后会一直播旧列表），ts 可以长缓存。
    # 同样要剥掉 /live 前缀，SRS 收到的是 /<app>/<stream>.m3u8。
    location ~ ^/live/.+\.m3u8$ {
        rewrite ^/live/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location /live/ {
        rewrite ^/live/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ---------------------------------------------------------------- 安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
