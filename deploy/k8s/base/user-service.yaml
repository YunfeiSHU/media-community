apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: auth-platform
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: auth-platform
spec:
  selector:
    app.kubernetes.io/name: user-service
  ports:
  - name: http
    port: 80
    targetPort: http
  - name: dubbo
    port: 20880
    targetPort: dubbo
  type: ClusterIP
