apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-envoy-config
  namespace: auth-platform
data:
  envoy.yaml: |
    static_resources:
      listeners:
      - name: inbound
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 8081
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: auth_inbound
              access_log:
              - name: envoy.access_loggers.stdout
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              route_config:
                name: auth_route
                virtual_hosts:
                - name: auth_service
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/" }
                    route:
                      cluster: auth_app
                      timeout: 15s
                      retry_policy:
                        retry_on: 5xx,connect-failure,reset
                        num_retries: 2
              http_filters:
              - name: envoy.filters.http.router
      - name: outbound
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 15001
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: auth_outbound
              route_config:
                name: user_route
                virtual_hosts:
                - name: user_service
                  domains: ["user-service", "user-service.auth-platform.svc.cluster.local"]
                  routes:
                  - match: { prefix: "/" }
                    route: { cluster: user_service, timeout: 10s }
              http_filters:
              - name: envoy.filters.http.router
      clusters:
      - name: auth_app
        connect_timeout: 1s
        type: STATIC
        load_assignment:
          cluster_name: auth_app
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  # 与 auth-service 的默认端口 8002 对齐（曾错写成 8080）
                  socket_address: { address: 127.0.0.1, port_value: 8002 }
      - name: user_service
        connect_timeout: 2s
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: user_service
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: user-service.auth-platform.svc.cluster.local, port_value: 80 }
        circuit_breakers:
          thresholds:
          - priority: DEFAULT
            max_connections: 100
            max_pending_requests: 100
            max_requests: 200
      admin:
        access_log_path: /dev/stdout
        address:
          socket_address: { address: 0.0.0.0, port_value: 9901 }
