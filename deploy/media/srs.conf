# SRS 5.x 配置（直播媒体服务器）
#
# 定位：live-service 只做「业务控制面」（直播间、开播关播、推拉流地址、在线人数），
#       真正的音视频传输由 SRS 承担。
#
# 推流：rtmp://localhost:1936/live/{streamKey}
# 拉流：http://localhost:8088/live/{streamKey}.m3u8        (HLS)
#       http://localhost:8088/live/{streamKey}.flv         (HTTP-FLV)
# API ：http://localhost:1986/api/v1/streams
#
# 关键点：http_hooks 把 SRS 的生命周期回调打回 live-service，
#         这样「主播推上流」与「数据库里 room 状态变为 LIVING」才会真正一致。

listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

rtc_server {
    enabled         on;
    listen          8000;
    # 本地开发：让浏览器用当前访问地址作为 WebRTC candidate
    candidate       $CANDIDATE;
}

vhost __defaultVhost__ {
    # HTTP-FLV：低延迟（2~3s），适合 Web 端
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    # HLS：兼容性最好，适合 App / 分享
    hls {
        enabled         on;
        hls_fragment    2;
        hls_window      12;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
    }

    # 推流鉴权 + 状态同步：交给 live-service 判定
    http_hooks {
        enabled         on;
        on_publish      http://host.docker.internal:9002/api/v1/live/hooks/on-publish;
        on_unpublish    http://host.docker.internal:9002/api/v1/live/hooks/on-unpublish;
        on_play         http://host.docker.internal:9002/api/v1/live/hooks/on-play;
        on_stop         http://host.docker.internal:9002/api/v1/live/hooks/on-stop;
    }
}
