# ===========================================================================
# Go 体系：video / live / danmaku 三个业务服务 + SRS 直播媒体服务器
#
# 默认 profile（不带 profiles 字段）→ `docker compose up -d` 就会起这三个服务。
# 它们连的是**宿主机**上的中间件（Java 那套 MySQL/Redis + 手工起的 RabbitMQ/MinIO），
# 容器内通过 host.docker.internal 回连，所以需要 extra_hosts。
#
# SRS 挂在 profile `media` 下：只有真要做直播推拉流时才需要它。
#
# 数据库表由各服务的 GORM AutoMigrate 自动建立，不需要先导入 DDL
# （仓储根 deploy/db/go/media-tables.sql 只是等价的、可人工审阅的基线）。
# ===========================================================================
name: media-stack

services:
  # ------------------------------------------------------------------ SRS
  # live-service 只负责控制面（房间、状态、推拉流地址、在线人数），
  # 真正的音视频传输由 SRS 承担。配置文件见 ./media/srs.conf
  srs:
    profiles: ["media"]
    image: ossrs/srs:5
    container_name: gomedia-srs
    restart: unless-stopped
    extra_hosts:
      # srs.conf 的 http_hooks 要回调宿主上的 live-service:9002，
      # 所以容器内必须有 host.docker.internal 这个名字
      - "host.docker.internal:host-gateway"
    ports:
      - "${SRS_RTMP_HOST_PORT:-1936}:1935"            # RTMP 推流
      - "${SRS_HTTP_HOST_PORT:-8088}:8080"            # HTTP-FLV / HLS
      - "${SRS_API_HOST_PORT:-1986}:1985"             # SRS HTTP API
      - "${SRS_WEBRTC_HOST_PORT:-8001}:8000/udp"      # WebRTC
      - "${SRS_WEBRTC_HOST_PORT:-8001}:8000/tcp"
    volumes:
      - ./media/srs.conf:/usr/local/srs/conf/srs.conf:ro
    command: ["./objs/srs", "-c", "conf/srs.conf"]

  # --------------------------------------------------------- video-service
  video-service:
    build:
      context: ../video-service-go
      dockerfile: Dockerfile
    container_name: gomedia-video
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: docker
      # 与 Java 共用：同一个 MySQL 实例、同一个 auth_service 库
      VIDEO_MYSQL_DSN: "${SHARED_MYSQL_USER:-root}:${SHARED_MYSQL_PASSWORD:?请在 deploy/.env 里设置 SHARED_MYSQL_PASSWORD（模板见 deploy/.env.example）}@tcp(${INFRA_MYSQL_HOST:-host.docker.internal}:${INFRA_MYSQL_PORT:-3306})/${SHARED_MYSQL_DATABASE:-auth_service}?charset=utf8mb4&parseTime=True&loc=Local"
      # 与 Java 共用：同一个 Redis 实例、同一个 db 0（靠 key 前缀隔离）
      VIDEO_REDIS_ADDR: "${INFRA_REDIS_HOST:-host.docker.internal}:${INFRA_REDIS_PORT:-6379}"
      VIDEO_REDIS_PASSWORD: ${SHARED_REDIS_PASSWORD:-}
      VIDEO_RABBITMQ_URL: "amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin}@${INFRA_RABBITMQ_HOST:-host.docker.internal}:${INFRA_RABBITMQ_PORT:-5672}/${RABBITMQ_VHOST:-/}"
      # endpoint 是服务端地址（容器视角），public_endpoint 是回给浏览器的地址（宿主机视角）
      VIDEO_MINIO_ENDPOINT: ${INFRA_MINIO_ENDPOINT:-host.docker.internal:9000}
      VIDEO_MINIO_PUBLIC_ENDPOINT: "http://${PUBLIC_HOST:-localhost}:${MINIO_HOST_PORT:-9000}"
      VIDEO_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      VIDEO_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      VIDEO_MINIO_BUCKET: ${MEDIA_BUCKET:-media}
      VIDEO_TRANSCODER_DRIVER: ${VIDEO_TRANSCODER_DRIVER:-mock}
    ports:
      - "9001:9001"

  # ---------------------------------------------------------- live-service
  live-service:
    build:
      context: ../live-service-go
      dockerfile: Dockerfile
    container_name: gomedia-live
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: docker
      LIVE_MYSQL_DSN: "${SHARED_MYSQL_USER:-root}:${SHARED_MYSQL_PASSWORD:?请在 deploy/.env 里设置 SHARED_MYSQL_PASSWORD（模板见 deploy/.env.example）}@tcp(${INFRA_MYSQL_HOST:-host.docker.internal}:${INFRA_MYSQL_PORT:-3306})/${SHARED_MYSQL_DATABASE:-auth_service}?charset=utf8mb4&parseTime=True&loc=Local"
      LIVE_REDIS_ADDR: "${INFRA_REDIS_HOST:-host.docker.internal}:${INFRA_REDIS_PORT:-6379}"
      LIVE_REDIS_PASSWORD: ${SHARED_REDIS_PASSWORD:-}
      LIVE_RABBITMQ_URL: "amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin}@${INFRA_RABBITMQ_HOST:-host.docker.internal}:${INFRA_RABBITMQ_PORT:-5672}/${RABBITMQ_VHOST:-/}"
      LIVE_MEDIA_DRIVER: ${LIVE_MEDIA_DRIVER:-mock}
      # 下面这几个是**回给主播/观众**的地址，必须是宿主机视角（不能用服务名）
      LIVE_SRS_RTMP_HOST: ${PUBLIC_HOST:-localhost}
      LIVE_SRS_RTMP_PORT: "${SRS_RTMP_HOST_PORT:-1936}"
      LIVE_SRS_HTTP_PORT: "${SRS_HTTP_HOST_PORT:-8088}"
      LIVE_SRS_WEBRTC_HOST: ${PUBLIC_HOST:-localhost}
      LIVE_SRS_WEBRTC_PORT: "${SRS_WEBRTC_HOST_PORT:-8001}"
      # 这个是**服务端自己**调 SRS HTTP API 用的地址，所以走服务名/宿主内网
      LIVE_SRS_API_BASE: ${INFRA_SRS_API_BASE:-http://host.docker.internal:1985}
      LIVE_SRS_APP: ${LIVE_SRS_APP:-live}
    ports:
      - "9002:9002"

  # ------------------------------------------------------- danmaku-service
  danmaku-service:
    build:
      context: ../danmaku-service-go
      dockerfile: Dockerfile
    container_name: gomedia-danmaku
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: docker
      DANMAKU_MYSQL_DSN: "${SHARED_MYSQL_USER:-root}:${SHARED_MYSQL_PASSWORD:?请在 deploy/.env 里设置 SHARED_MYSQL_PASSWORD（模板见 deploy/.env.example）}@tcp(${INFRA_MYSQL_HOST:-host.docker.internal}:${INFRA_MYSQL_PORT:-3306})/${SHARED_MYSQL_DATABASE:-auth_service}?charset=utf8mb4&parseTime=True&loc=Local"
      DANMAKU_REDIS_ADDR: "${INFRA_REDIS_HOST:-host.docker.internal}:${INFRA_REDIS_PORT:-6379}"
      DANMAKU_REDIS_PASSWORD: ${SHARED_REDIS_PASSWORD:-}
      DANMAKU_RABBITMQ_URL: "amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin}@${INFRA_RABBITMQ_HOST:-host.docker.internal}:${INFRA_RABBITMQ_PORT:-5672}/${RABBITMQ_VHOST:-/}"
      # WebSocket 跨域白名单；容器内跑通常前端在宿主机，放开即可
      DANMAKU_WS_ORIGINS: ${DANMAKU_WS_ORIGINS:-*}
    ports:
      - "9003:9003"
