server:
  port: 8082

dubbo:
  application:
    name: user-service
    qos-enable: ${DUBBO_QOS_ENABLE:false}
  protocol:
    name: dubbo
    port: 20881
  registry:
    address: ${NACOS_REGISTRY_ADDRESS:nacos://localhost:8848}
    username: ${NACOS_USERNAME:nacos}
    password: ${NACOS_PASSWORD:nacos}
    register: true
    subscribe: true
  scan:
    base-packages: com.example.userservice.rpc

spring:
  application:
    name: user-service
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/auth_service?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:***REMOVED***}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  type-handlers-package: com.example.userservice.repository

logging:
  level:
    com.example.userservice.repository: debug
