apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: auth-platform
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: auth-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/part-of: auth-platform
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: auth-service
        image: auth-service:local
        imagePullPolicy: IfNotPresent
        ports:
        - name: app
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: auth-service-config
        - secretRef:
            name: auth-service-secrets
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: app
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: app
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      - name: envoy
        image: envoyproxy/envoy:v1.31-latest
        args: ["-c", "/etc/envoy/envoy.yaml"]
        ports:
        - name: http
          containerPort: 8081
        - name: admin
          containerPort: 9901
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy
          readOnly: true
        readinessProbe:
          httpGet:
            path: /ready
            port: admin
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
      volumes:
      - name: envoy-config
        configMap:
          name: auth-envoy-config
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: auth-platform
  labels:
    app.kubernetes.io/name: auth-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9901"
    prometheus.io/path: /stats/prometheus
spec:
  selector:
    app.kubernetes.io/name: auth-service
  ports:
  - name: http
    port: 80
    targetPort: http
  type: ClusterIP
