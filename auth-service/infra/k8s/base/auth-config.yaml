apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: auth-platform
data:
  SPRING_SQL_INIT_MODE: "always"
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_service?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
  SPRING_DATASOURCE_USERNAME: auth
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  USER_SERVICE_DUBBO_URL: dubbo://user-service:20880
  AUTH_ACCESS_TOKEN_TTL_SECONDS: "1800"
  AUTH_REFRESH_TOKEN_TTL_SECONDS: "604800"
  AUTH_LOGIN_RATE_LIMIT_MAX_ATTEMPTS: "5"
  AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS: "60"
