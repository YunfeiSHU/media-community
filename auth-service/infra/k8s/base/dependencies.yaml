apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: auth-platform
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: replace-with-a-root-password
  MYSQL_PASSWORD: replace-with-a-database-password
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  namespace: auth-platform
data:
  01-create-database.sql: |
    CREATE DATABASE IF NOT EXISTS auth_service DEFAULT CHARACTER SET utf8mb4;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: auth-platform
  labels:
    app.kubernetes.io/name: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.4
        ports:
        - name: mysql
          containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          value: auth_service
        - name: MYSQL_USER
          value: auth
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_PASSWORD
        volumeMounts:
        - name: init
          mountPath: /docker-entrypoint-initdb.d
        - name: data
          mountPath: /var/lib/mysql
      volumes:
      - name: init
        configMap:
          name: mysql-init
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: auth-platform
spec:
  selector:
    app.kubernetes.io/name: mysql
  ports:
  - name: mysql
    port: 3306
    targetPort: mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: auth-platform
  labels:
    app.kubernetes.io/name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - name: redis
          containerPort: 6379
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: auth-platform
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
  - name: redis
    port: 6379
    targetPort: redis
