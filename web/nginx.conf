# 容器内使用的 Nginx 配置（docker-compose 网络里的服务名）
#
# 与 deploy/nginx/media-platform.conf 的区别：
#   - 那份是**宿主机**部署，上游是 127.0.0.1:xxxx；
#   - 这份是**容器内**部署，上游是 compose 服务名 gateway / minio / srs。
# 其余规则（上传超时、m3u8 不缓存、WS Upgrade）保持一致。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 16m;
    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/api/v1/videos/[^/]+/upload {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /media/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~ ^/live/.+\.m3u8$ {
        rewrite ^/live/(.*)$ /$1 break;
        proxy_pass http://srs:8080;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location /live/ {
        rewrite ^/live/(.*)$ /$1 break;
        proxy_pass http://srs:8080;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
