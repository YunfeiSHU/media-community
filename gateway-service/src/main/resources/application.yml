server:
  port: 8000

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        register-enabled: true
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yaml
        import-check:
          enabled: false
    gateway:
      discovery:
        locator:
          # 关闭自动路由，避免 /user-service/** 这类隐式路径暴露
          enabled: false
      routes:
        # 用户服务
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**,/api/v1/admin/users/**
        # 认证服务
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
      # 全局默认过滤器
      default-filters:
        # 移除下游服务不需要的敏感头
        - RemoveRequestHeader=Cookie
        - RemoveRequestHeader=Set-Cookie
      httpclient:
        connect-timeout: 3000
        response-timeout: 10s

# 网关自身的 JWT 配置
gateway:
  auth:
    # 无需认证即可访问的路径（Ant 风格）
    permit-all:
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /api/v1/auth/register
    jwt:
      # 生产环境务必通过环境变量注入，不要提交到仓库
      secret: ${JWT_SECRET:change-me-in-production-this-key-must-be-at-least-32-bytes-long}
      # 从 token 中提取用户 ID 的 claim 名
      user-id-claim: sub
      # 从 token 中提取角色的 claim 名
      role-claim: role

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - gateway
  endpoint:
    health:
      show-details: always
